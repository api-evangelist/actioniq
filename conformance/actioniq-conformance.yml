name: ActionIQ Conformance
description: >-
  Cross-cutting standards conformance for ActionIQ. The organizational and
  regulatory rows are asserted by the parent brand: ActionIQ was acquired by
  Uniphore in December 2024, actioniq.com 301-redirects to
  www.uniphore.com/actioniq/, and the certifications are published on Uniphore's
  SafeBase trust center. The API-standards rows are all UNKNOWN rather than false
  — ActionIQ publishes no OpenAPI, and both the API host (403) and the help
  center (Auth0-gated) are unreadable anonymously, so nothing could be observed
  either way. An unknown is recorded as conforms:false with the reason stated;
  it is an absence of evidence, not evidence of absence.
