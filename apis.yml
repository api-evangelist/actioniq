x-coverage:
  state: gated
  reason: customer-only-docs
  detail: >-
    The ActionIQ API reference is a GitBook space at
    docs.actioniq.com/actioniq-help-center gated by an Auth0 visitor-auth
    integration — every path 307s to integrations.gitbook.com, then 302s to
    login.actioniq.com/authorize and ends on an Auth0 error page — while the
    live production host api.actioniq.com answers 403 Forbidden from AWS API
    Gateway on every path, so no OpenAPI, error catalog, or rate-limit header
    could be read anonymously.
  evidence:
    - url: https://docs.actioniq.com/actioniq-help-center
      status: 400
    - url: https://api.actioniq.com/openapi.json
      status: 403
    - url: https://www.actioniq.com/library/
      status: 301
    - url: https://status.actioniq.com/
      status: 200
  checked: '2026-08-13'
